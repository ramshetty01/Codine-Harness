name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NVIDIA_API_KEY: ''
  OPENROUTER_API_KEY: ''
  OPENAI_API_KEY: ''
  CODINE_PROVIDER: nvidia
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and build tooling
        run: python -m pip install -r requirements.txt 'build>=1.2,<2'
      - name: Offline unit, PTY and CLI checks
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: |
          python -m unittest discover -s tests -v
          python main.py --check
          python -m codine --version
          python -m codine.evals --offline --report .codine/evals/offline.json
      - name: Alternate terminal emulation
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
          CODINE_TEST_TERM: vt100
        run: python -m unittest discover -s tests -p test_terminal_integration.py -v
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Install wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/codine-installed"
          "$RUNNER_TEMP/codine-installed/bin/python" -m pip install dist/*.whl
          python scripts/check_install.py "$RUNNER_TEMP/codine-installed/bin/python"
      - name: Installed offline evaluation outside checkout
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: |
          mkdir -p "$RUNNER_TEMP/codine-project"
          cd "$RUNNER_TEMP/codine-project"
          "$RUNNER_TEMP/codine-installed/bin/python" -m codine.evals --offline
      - name: Retain offline evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python }}
          path: .codine/evals/offline.json
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Linux Docker boundaries and repository fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EVAL_IMAGE: python@sha256:191083cdf6c7bda8c76158983163ead5d5cf7b77cf3033e805bb0f5296f51b4b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and pinned evaluation image
        run: |
          python -m pip install -r requirements.txt
          docker info
          docker pull "$EVAL_IMAGE"
          docker tag "$EVAL_IMAGE" python:3.12-slim
          docker image inspect "$EVAL_IMAGE" --format '{{.Id}}'
      - name: Docker boundary regressions
        env:
          CODINE_DOCKER_TESTS: '1'
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: |
          python -m unittest discover -s tests -p test_sandbox.py -v
          python -m unittest discover -s tests -p test_repository_evals.py -v
          python -m unittest discover -s tests -p test_repository_executor.py -v
      - name: Docker repository evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: python -m codine.evals --offline --executor docker --image "$EVAL_IMAGE" --suite repository --report .codine/evals/repository.json
      - name: Retain Docker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-repository-evaluation
          path: .codine/evals/repository.json
          if-no-files-found: ignore
          retention-days: 7
